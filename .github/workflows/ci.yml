name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Python with Ruff
        [cite_start]run: pip install ruff && ruff check . [cite: 222]

      - name: Build Docker Image
        [cite_start]run: docker compose build [cite: 222]

      - name: Start Full Stack
        [cite_start]run: docker compose up -d [cite: 222]

      - name: Wait for Health Check
        run: |
          for i in {1..10}; do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' statuspulse-app-1)" == "healthy" ]; then exit 0; fi
            sleep 5
          done
          exit 1 [cite: 224]

      - name: Run Integration Tests
        [cite_start]run: bash tests/test_integration.sh [cite: 224]

      - name: Tear Down Stack
        if: always()
        [cite_start]run: docker compose down [cite: 224]

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          [cite_start]path: tests/ [cite: 224]