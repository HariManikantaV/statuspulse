name: Deploy Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push
        run: |
          # This line converts the repository name to lowercase
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=ghcr.io/$REPO_LOWER/app
          
          docker build . -t $IMAGE_ID:latest -t $IMAGE_ID:${{ github.sha }}
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:${{ github.sha }}

      - name: Local Deployment & Health Check
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}/app
          docker pull $IMAGE_ID:latest
          docker compose up -d app
          echo "Waiting for health check..."
          sleep 15
          if ! curl -f http://localhost:8000/health; then
            echo "Health check failed! Rolling back..."
            exit 1
          fi
          echo "Deployment successful!"