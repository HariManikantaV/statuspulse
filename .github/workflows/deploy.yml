- name: Local Deployment & Health Check
        run: |
          # 1. Pull the new image locally
          IMAGE_ID=ghcr.io/${{ github.repository }}/app
          docker pull $IMAGE_ID:latest
          
          # 2. Update the stack
          docker compose up -d app
          
          # 3. Post-deployment health check
          echo "Waiting for health check..."
          sleep 15
          if ! curl -f http://localhost:8000/health; then
            echo "Health check failed! Rolling back to previous stable image..."
            # Simple rollback: pull and run the last known image if you have a backup tag
            # For now, we exit 1 to show the failure in GitHub Actions
            exit 1
          fi
          echo "Deployment successful and healthy!"

      - name: Success Notification
        if: success()
        run: |
          echo "Deployment to MacBook M2 successful!"
          # Add your Slack/Discord webhook here if you have one!