name: Deploy Pipeline

on:
  push:
    [cite_start]branches: [ main ] # Only runs after CI passes on main 

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        [cite_start]run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin [cite: 225]

      - name: Build and Push
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}/app
          docker build . -t $IMAGE_ID:latest -t $IMAGE_ID:${{ github.sha }}
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:${{ github.sha }} [cite: 225, 237]

      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /app/statuspulse
            docker compose pull app
            docker compose up -d app
            # Post-deployment health check 
            sleep 10
            if ! curl -f http://localhost:8000/health; then
              echo "Health check failed! Rolling back..."
              docker compose rollback app # Simplified logic 
              exit 1
            fi